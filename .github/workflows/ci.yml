name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run flake8

      - name: Audit dependencies
        run: uv audit --no-dev

  bundle:
    name: Build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Build
        run: ./deploy.sh

      - name: Verify bundle
        run: |
          unzip -l lambda-bundle.zip > bundle-listing.txt
          grep -q "lambda_function.py" bundle-listing.txt
          grep -q "tidal_functions.py" bundle-listing.txt
          grep -q "cache.py" bundle-listing.txt
          grep -q "x86_64-linux-gnu" bundle-listing.txt

          if grep -q "darwin" bundle-listing.txt; then
            echo "Bundle contains macOS artifacts" >&2
            exit 1
          fi

          if grep -qE '(^|/)\.env$' bundle-listing.txt; then
            echo "Bundle contains .env" >&2
            exit 1
          fi
